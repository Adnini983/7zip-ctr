; ============================================================
; 7-Zip CTR - FIRM public-key folder config (independent .ini)
; Ship this template into your keystone\pubkey folder alongside
; retail_firm_pubkey.bin / dev_firm_pubkey.bin.
;
; Each unit can be provided EITHER as a 512-char hex plaintext
; (RetailFirmPubKeyHex= / DevFirmPubKeyHex=, exactly 512 hex digits,
; no 0x prefix) OR as a standalone 256-byte modulus file named by
; RetailFirmPubKeyFile= / DevFirmPubKeyFile=. The Hex keys take
; precedence over the File keys. Relative paths below are resolved
; against this folder; absolute paths are used as-is.
;
; Modulus offsets inside a private 64KB boot9.bin dump:
;   retail @0xB1E0  (keyslot1 NAND-FIRM, retail unit)
;   dev    @0xC4E0  (keyslot1 NAND-FIRM, dev unit)
; Never place a boot9.bin dump in this folder.
;
; Fallback when this .ini is missing/corrupt or neither the hex nor
; the referenced files can be used: the handler scans the ctrdevice
; folder (DeviceDataDir=, default keystone\ctrdevice) and each
; per-console sub-folder's "ctrindex.ini" is checked for its
; "boot9=" key. If no such ctrindex.ini is found, FIRM signature
; verification is skipped entirely.
; ============================================================

[FirmPubKey]
RetailFirmPubKeyHex=
DevFirmPubKeyHex=
RetailFirmPubKeyFile=retail_firm_pubkey.bin
DevFirmPubKeyFile=dev_firm_pubkey.bin
