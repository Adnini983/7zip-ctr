name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup MSVC
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" ^
          -latest ^
          -products * ^
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 ^
          -property installationPath > vs_path.txt

          set /p VS_PATH=<vs_path.txt

          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          cl


      - name: Build 7-Zip CTR
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" ^
          -latest ^
          -products * ^
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 ^
          -property installationPath > vs_path.txt

          set /p VS_PATH=<vs_path.txt

          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"


          mkdir out


          cd CPP\7zip\Bundles\Format7zF
          nmake /F makefile


      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-ctr-build
          path: out/