name: build

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC and build (7z.dll, 7zFM.exe, 7z.exe)
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" ^
            -latest ^
            -products * ^
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 ^
            -property installationPath > vs_path.txt
          set /p VS_PATH=<vs_path.txt
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          rem Clear any externally-injected CL flags so the build starts from a
          rem clean environment. PCH (precompiled header) consistency issues are
          rem handled in CPP/Build.mak (it adds /Y- to disable the PCH), which
          rem avoids MSVC C2855 (charset inconsistent with precompiled header)
          rem regardless of the runner environment.
          set CL=

          cd CPP\7zip\Bundles\Format7zF
          nmake /F makefile

          cd ..\Fm
          nmake /F makefile

          cd ..\..\UI\Console
          nmake /F makefile

      - name: Collect artifacts
        shell: cmd
        run: |
          mkdir out
          copy CPP\7zip\Bundles\Format7zF\x64\7z.dll out\
          copy CPP\7zip\Bundles\Fm\x64\7zFM.exe out\
          copy CPP\7zip\UI\Console\x64\7z.exe out\
          mkdir out\Lang
          xcopy Lang out\Lang\ /E /I /Y >nul
          copy keystone.ini out\ >nul
          if not exist out\7z.dll   (echo ERROR: 7z.dll was not built   & exit /b 1)
          if not exist out\7zFM.exe (echo ERROR: 7zFM.exe was not built & exit /b 1)
          if not exist out\7z.exe   (echo ERROR: 7z.exe was not built   & exit /b 1)
          if not exist out\Lang\zh-cn.txt (echo ERROR: Lang pack was not copied & exit /b 1)

      - name: Smoke test (synthetic 3DS containers, no ROM data involved)
        shell: cmd
        run: |
          rem Every fixture below is generated from scratch by scripts\make_fixtures.ps1:
          rem a plaintext ExeFS, a plaintext RomFS (one file), and negative cases.
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\make_fixtures.ps1 -OutDir fixtures
          if not exist fixtures\romfs.bin (echo ERROR: fixture generation failed & exit /b 1)

          rem --- plaintext RomFS: must be recognised and list its file -------------
          out\7z.exe l fixtures\romfs.bin > smoke_romfs.txt
          if errorlevel 1 (echo ERROR: romfs.bin did not open & type smoke_romfs.txt & exit /b 1)
          findstr /C:"RomFS (plaintext)" smoke_romfs.txt >nul || (echo ERROR: romfs container not detected & exit /b 1)
          findstr /C:"hello.txt" smoke_romfs.txt >nul || (echo ERROR: romfs file not listed & exit /b 1)

          rem --- extraction must reproduce the payload byte for byte ---------------
          out\7z.exe e fixtures\romfs.bin hello.txt -osmoke_x -y >nul
          if errorlevel 1 (echo ERROR: romfs extract failed & exit /b 1)
          fc /b smoke_x\hello.txt fixtures\hello.expected >nul || (echo ERROR: romfs payload mismatch & exit /b 1)

          rem --- plaintext ExeFS ---------------------------------------------------
          out\7z.exe l fixtures\exefs.bin > smoke_exefs.txt
          if errorlevel 1 (echo ERROR: exefs.bin did not open & type smoke_exefs.txt & exit /b 1)
          findstr /C:"ExeFS (plaintext)" smoke_exefs.txt >nul || (echo ERROR: exefs container not detected & exit /b 1)
          findstr /C:"banner" smoke_exefs.txt >nul || (echo ERROR: exefs entry not listed & exit /b 1)

          rem --- negative cases: must be rejected, and must not hang or crash ------
          out\7z.exe l fixtures\bad_romfs.bin >nul 2>&1
          if not errorlevel 1 (echo ERROR: out-of-range RomFS was accepted & exit /b 1)
          out\7z.exe l fixtures\garbage.bin >nul 2>&1
          if not errorlevel 1 (echo ERROR: garbage file was accepted & exit /b 1)

          rem --- synthetic .csu (CTR System Updater) -------------------------------
          rem NCSD -> NCCH (fixed-key crypto) -> encrypted RomFS with CupList and
          rem Contents.cnt. The per-title .cia items are synthesised while parsing
          rem the RomFS, so they must inherit its crypto context: without that the
          rem extraction returns raw ciphertext and every byte differs.
          out\7z.exe x fixtures\update.csu -ocsu_x -y >nul
          if errorlevel 1 (echo ERROR: update.csu did not extract & exit /b 1)
          if not exist "csu_x\Partition_0\Contents\000400000ff40002.cia" (echo ERROR: .csu CIA item missing & exit /b 1)
          if not exist "csu_x\Partition_0\Contents.cnt" (echo ERROR: .csu Contents.cnt missing & exit /b 1)
          fc /b "csu_x\Partition_0\Contents\000400000ff40002.cia" fixtures\csu.expected.cia >nul || (echo ERROR: .csu expanded CIA mismatch & exit /b 1)

          rem --- stock 7-Zip functionality must still work ------------------------
          del /q smoke_plain.7z 2>nul
          out\7z.exe a smoke_plain.7z fixtures\hello.expected fixtures\garbage.bin >nul
          if errorlevel 1 (echo ERROR: cannot create a 7z archive & exit /b 1)
          out\7z.exe t smoke_plain.7z >nul
          if errorlevel 1 (echo ERROR: cannot test a 7z archive & exit /b 1)

          echo Smoke test OK

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-ctr-x64
          path: out/
          retention-days: 14
