; ============================================================
; 7-Zip CTR - keystone.ini (custom 3DS AES key folders)
; Place this file next to 7z.dll (and 7zFM.exe).
; Leave a key empty, or delete it, to use the built-in default folder.
;
; Built-in defaults (relative to the 7z.dll folder):
;   RetailCTRAESKeyDir = keystone\ctraes_retail
;   DevCTRAESKeyDir    = keystone\ctraes_dev
;   DeviceDataDir      = keystone\ctrdevice
;
; DeviceDataDir holds per-console unique data (boot9.bin, otp.mem/otp_dec.mem,
; nand_cid.mem, ctrindex.ini) in a sub-folder per machine; it is private and
; must NOT be committed to the repository or shipped in a public release.
;
; Absolute paths are used as-is.
; Relative paths are resolved against the folder that contains 7z.dll.
; You can also set the folders in: 7zFM > Tools > Options > Keystone (密钥库).
; ============================================================

[Keystone]
RetailCTRAESKeyDir=
DevCTRAESKeyDir=
DeviceDataDir=
